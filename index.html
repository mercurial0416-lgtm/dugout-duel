function renderCareer(){let p=s.player,st=p.seasonStats||{},w=+s.week||1;$('#stage').textContent=p.stage==='HIGH_SCHOOL'?'HIGH SCHOOL · FINAL SEASON':'PRO CAREER';$('#ctitle').textContent=p.stage==='HIGH_SCHOOL'?'DRAFT ROAD':`${p.team||p.wishTeam} · YEAR ${p.proYear||1}`;$('#season').textContent='SEASON '+s.season;$('#week').textContent=`WEEK ${w} / 12`;$('#player').innerHTML=`<div class="avatar">${pic(p)}</div><div><div class="name">${esc(p.name)}</div><div class="pmeta">#${p.number} · ${esc(p.position)} · ${esc(p.throwBat)}<br>AVG ${avg(st)} · HR ${+st.hr||0} · RBI ${+st.rbi||0} · WAR ${(+st.war||0).toFixed(2)}</div></div><div class="scout"><small>SCOUT</small><b>${grade(p.scoutInterest)}</b></div>`;let title=p.stage==='HIGH_SCHOOL'?events[w-1]:`프로 ${p.proYear||1}년차 · ${w}주`,desc=p.stage==='HIGH_SCHOOL'?'이번 주 경기와 훈련 방향을 결정한다. 선택에 따라 성적, 성장, 스카우트 평가가 함께 변한다.':'정규 시즌 일정이 이어진다. 현재 역할과 컨디션에 맞춰 접근을 선택한다.';$('#scene').innerHTML=`<div class="kicker">WEEK ${w}</div><h2>${esc(title)}</h2><p>${desc}</p><div class="tags"><span class="tag accent">폼 ${+p.form||0}</span><span class="tag">피로 ${+p.fatigue||0}</span><span class="tag">감독 ${+p.managerTrust||0}</span><span class="tag">스카우트 ${+p.scoutInterest||0}</span></div><div class="decisionList">${[['contact','컨택','안정적인 타격'],['power','장타','강한 타구와 홈런'],['discipline','선구','출루와 존 관리'],['speed','주루·수비','운동 능력'],['recovery','회복','피로 관리']].map(x=>`<button class="decision" data-a="${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</div>`;$$('[data-a]').forEach(b=>b.onclick=()=>week(b.dataset.a))}async function week(a){if(busy)return;busy=true;let before=JSON.parse(JSON.stringify(s));try{s=await rpc('dugout_solo_action',{p_token:token(),p_action:a});let p=s.player,l=p.lastWeek||{},draft=before.player.stage==='HIGH_SCHOOL'&&p.stage==='PRO';$('#modalCard').innerHTML=`<div class="kicker">${draft?'DRAFT RESULT':'WEEK RESULT'}</div><h2>${draft?esc(p.draft||'지명 결과'):esc(p.lastEvent?.title||'주간 결과')}</h2><p class="muted" style="font-size:11px">${draft?`${esc(p.team)}에서 프로 커리어를 시작합니다.`:esc(p.lastEvent?.body||'')}</p><div class="rstats"><div class="rs"><small>PA</small><b>${+l.pa||0}</b></div><div class="rs"><small>H</small><b>${+l.h||0}</b></div><div class="rs"><small>HR</small><b>${+l.hr||0}</b></div><div class="rs"><small>WAR</small><b>${(+l.war||0).toFixed(2)}</b></div></div><button id="cont" class="primary">계속</button>`;$('#modal').classList.add('show');$('#cont').onclick=()=>{$('#modal').classList.remove('show');renderCareer()}}catch(x){toast(x.message)}finally{busy=false}}
function renderProfile(){let p=s.player,st=p.careerStats||{};$('#profileContent').innerHTML=`<div class="kicker">PLAYER PROFILE</div><h1>${esc(p.name)}</h1><div class="player"><div class="avatar">${pic(p)}</div><div><div class="name">#${p.number} ${esc(p.position)}</div><div class="pmeta">${esc(p.throwBat)} · ${p.height}cm<br>${esc(p.school||'')} · ${esc(p.team||'고교')}</div></div><div class="scout"><small>DUEL</small><b>${+p.duelWins||0}-${+p.duelLosses||0}</b></div></div><div class="profileGrid"><div class="pi"><small>드래프트</small><b>${esc(p.draft||'—')}</b></div><div class="pi"><small>통산 AVG</small><b>${avg(st)}</b></div></div><div style="margin-top:12px">${[['CON',p.contact],['POW',p.power],['DISC',p.discipline],['SPD',p.speed],['DEF',p.defense]].map(x=>`<div class="attr"><span>${x[0]}</span><div class="bar"><i style="width:${+x[1]||0}%"></i></div><b>${+x[1]||0}</b></div>`).join('')}</div><button id="unlink" class="danger" style="margin-top:20px">이 기기 선수 연결 해제</button>`;$('#unlink').onclick=()=>{localStorage.removeItem(PK);cr();location.reload()}}
function lobby(){room=rr();$('#rivalContent').innerHTML=`<div class="kicker">ONLINE RIVAL</div><h1>라이벌전</h1><p>각자의 커리어 선수가 실제 9이닝 경기에서 맞붙습니다. 나머지 타순은 CPU가 진행합니다.</p><div class="block"><button id="host" class="primary">비공개 룸 생성</button></div><div class="block"><div class="join"><input id="code" maxlength="10" placeholder="ROOM CODE"><button id="join">입장</button></div></div>${room?`<div class="block"><div class="roomCode">${esc(room.code)}</div><button id="resume" class="secondary">이어하기</button></div>`:''}`;$('#host').onclick=host;$('#join').onclick=()=>join($('#code').value);if($('#resume'))$('#resume').onclick=openRoom}async function host(){let d=await rpc('dugout_create_room_v2',{p_player_token:token()});sr({code:d.code,roomToken:d.roomToken});openRoom()}async function join(c){c=String(c||'').trim().toUpperCase();if(!c)return;try{let d=await rpc('dugout_join_room_v2',{p_code:c,p_player_token:token()});sr({code:d.code,roomToken:d.roomToken});openRoom()}catch(x){toast(x.message)}}async function openRoom(){room=rr();if(!room)return lobby();$('#rivalContent').innerHTML='<div class="wait"><div class="kicker">MATCH</div><h2>경기 상태 확인 중</h2></div>';try{let d=await rpc('dugout_get_room_v2',{p_code:room.code,p_room_token:room.roomToken});if(!d.guest){$('#rivalContent').innerHTML=`<div class="wait"><div class="kicker">PRIVATE ROOM</div><div class="roomCode">${esc(room.code)}</div><h2>상대 입장 대기</h2><button id="copy" class="primary">룸 코드 복사</button><button id="leave" class="secondary" style="margin-top:8px">나가기</button></div>`;$('#copy').onclick=()=>navigator.clipboard?.writeText(room.code);$('#leave').onclick=()=>{cr();lobby()};startPoll('room');return}match=await rpc('dugout_start_match_v1',{p_code:room.code,p_room_token:room.roomToken});renderMatch();startPoll('match')}catch(x){toast(x.message)}}function ko(o){return({OUT:'아웃',BB:'볼넷','1B':'안타','2B':'2루타','3B':'3루타',HR:'홈런',SAC:'희생타'})[o]||o||''}function hk(h){return h==='top'?'초':'말'}function ck(c){return({contact:'컨택',power:'강공',patient:'기다리기',situational:'진루타',challenge:'정면승부',chase:'유인구',suppress:'장타 억제',pitcharound:'승부 회피'})[c]||c||''}function renderMatch(){let h=match.host||{},g=match.guest||{},me=match.mySide==='host'?h:g,line=match.mySide==='host'?match.hostLine:match.guestLine;$('#rivalContent').innerHTML=`<div class="scoreHead"><div class="inning"><b>${match.inning}회${hk(match.half)}</b><span>OUT ${'●'.repeat(match.outs)}${'○'.repeat(3-match.outs)}</span></div><div class="team"><div><h3>${esc(g.team||g.wishTeam)}</h3><p>${esc(g.name)} · ${esc(g.position)}</p></div><div class="score">${match.guestScore}</div></div><div class="team"><div><h3>${esc(h.team||h.wishTeam)}</h3><p>${esc(h.name)} · ${esc(h.position)}</p></div><div class="score">${match.hostScore}</div></div><div class="bases"><div class="diamond"><i class="base b2 ${match.bases?.[1]?'on':''}"></i><i class="base b1 ${match.bases?.[0]?'on':''}"></i><i class="base b3 ${match.bases?.[2]?'on':''}"></i></div></div></div>${match.phase==='finished'?finish(me,line):decision()}${match.lastPlay?`<div class="last"><b>${esc(match.lastPlay.batter||'CPU')} · ${ko(match.lastPlay.outcome)}</b><p>${match.lastPlay.batChoice?`공격 ${ck(match.lastPlay.batChoice)} / 수비 ${ck(match.lastPlay.defChoice)}`:'CPU 자동 진행'}</p></div>`:''}<div class="log">${[...(match.plays||[])].slice(-10).reverse().map(p=>`<div class="logline"><span>${p.inning}회${hk(p.half)}</span><b>${esc(p.batter||'CPU')} · ${ko(p.outcome)}</b><span>${p.score?.[0]??0}:${p.score?.[1]??0}</span></div>`).join('')}</div>`;$$('[data-m]').forEach(b=>b.onclick=()=>submit(b.dataset.m));if($('#back'))$('#back').onclick=async()=>{await reload();renderCareer();show('career')};if($('#close'))$('#close').onclick=()=>{cr();lobby();stopPoll()}}function decision(){let bat=match.myRole==='bat',ready=bat?match.offenseReady:match.defenseReady,cur=match.offense==='host'?match.host:match.guest;if(ready)return`<div class="match"><div class="kicker">${bat?'BATTING':'DEFENSE'}</div><h2>${esc(cur?.name)} 타석</h2><div class="waiting">상대 선택 대기 중</div></div>`;let a=bat?[['contact','컨택','안타 확률 상승'],['power','강공','장타 확률 상승'],['patient','기다리기','볼넷 확률 상승'],['situational','진루타','주자 진루 우선']]:[['challenge','정면승부','볼넷 억제'],['chase','유인구','범타 유도'],['suppress','장타 억제','홈런 위험 감소'],['pitcharound','승부 회피','출루 감수']];return`<div class="match"><div class="kicker">내 역할 · ${bat?'타격':'수비 지시'}</div><h2>${esc(cur?.name)} 타석</h2><div class="matchChoices">${a.map(x=>`<button class="matchChoice" data-m="${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</div></div>`}function finish(me,l){let r=match.winner==='tie'?'무승부':match.winner===match.mySide?'승리':'패배';return`<div class="final"><div class="kicker accent">FINAL</div><h2>${match.guestScore} : ${match.hostScore}</h2><b>${r}</b><div class="box"><div><small>${esc(me.name)}</small><b>${l.pa}타석 ${l.h}안타</b></div><div><small>HR / RBI</small><b>${l.hr} / ${l.rbi}</b></div></div><button id="back" class="primary">커리어로 돌아가기</button><button id="close" class="secondary" style="margin-top:8px">룸 닫기</button></div>`}async function submit(c){if(busy)return;busy=true;try{match=await rpc('dugout_submit_match_choice_v1',{p_code:room.code,p_room_token:room.roomToken,p_choice:c});renderMatch()}catch(x){toast(x.message)}finally{busy=false}}async function reload(){try{s=await rpc('dugout_get_player',{p_token:token()})}catch{}}function startPoll(mode){stopPoll();let tick=async()=>{if(active!=='rival'||!room)return;try{if(mode==='room'){let d=await rpc('dugout_get_room_v2',{p_code:room.code,p_room_token:room.roomToken},4000);if(d.guest){match=await rpc('dugout_start_match_v1',{p_code:room.code,p_room_token:room.roomToken},4000);mode='match';renderMatch()}}else{match=await rpc('dugout_get_match_v1',{p_code:room.code,p_room_token:room.roomToken},4000);renderMatch();if(match.phase==='finished')await reload()}}catch{}poll=setTimeout(tick,1200)};poll=setTimeout(tick,1200)}function stopPoll(){if(poll){clearTimeout(poll);poll=null}}
$$('#tabs button').forEach(b=>b.onclick=()=>{let t=b.dataset.tab;if(t==='career')renderCareer();if(t==='profile')renderProfile();if(t==='rival'){lobby();setTimeout(()=>{if(rr())openRoom()},0)}show(t)});boot()})();
</script></body></html>
