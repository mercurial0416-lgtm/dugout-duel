<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>DUGOUT RUSH</title><link rel="stylesheet" href="./game-v35.css?v=35"></head><body><div class="app"><header class="top"><div class="logo">DUGOUT <b>RUSH</b></div><div class="meta">3-INNING COMEBACK</div></header>
